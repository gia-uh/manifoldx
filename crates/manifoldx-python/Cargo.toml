[package]
name = "manifoldx-python"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "manifoldx"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
manifoldx-core = { path = "../manifoldx-core" }
manifoldx-render = { path = "../manifoldx-render" }
# Same major version the spike crates on this branch were verified with. The
# extension-module feature is enabled by maturin at wheel build time (see
# [tool.maturin] in pyproject.toml), so `cargo test` keeps linking libpython.
pyo3 = { version = "0.30" }
