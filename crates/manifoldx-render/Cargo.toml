[package]
name = "manifoldx-render"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "manifoldx_render"
path = "src/lib.rs"

[[bin]]
name = "native-scene"
path = "src/bin/native-scene.rs"

[dependencies]
bytemuck = "=1.25.2"
fontdue = "=0.9.3"
manifoldx-core = { path = "../manifoldx-core" }
pollster = "=0.4.0"
# The same pinned graphics stack the baseline native surface probe used.
# The renderer owns one device/queue pair; no Python or wgpu-py handle crosses
# this boundary. Vulkan is the Linux target; other backends arrive with the
# platform slices.
wgpu = { version = "=29.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "rwh_06"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=29.0.1", default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=29.0.1", default-features = false, features = ["metal"] }
