[package]
name = "manifoldx-spike-sb"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "_spike_sb"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
manifoldx-sdk = { path = "../manifoldx-sdk" }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
