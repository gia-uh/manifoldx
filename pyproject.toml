[project]
name = "manifold-gfx"
version = "0.10.0"
description = "Real-time 3D rendering engine with ECS architecture, built on pure wgpu"
readme = "README.md"
authors = [
    { name = "Alejandro Piad", email = "apiad@apiad.net" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.4",
    "rendercanvas>=2.6.3",
    "tqdm>=4.67.3",
    "wgpu>=0.31.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
manifoldx = "manifoldx.cli:main"

[project.optional-dependencies]
desktop = ["glfw>=2.0"]
offline = [
    "imageio-ffmpeg>=0.5",
]
viz = ["pillow>=10.0"]
svg = ["thorvg-python>=1.1.3"]
audio = ["sounddevice>=0.5"]
all = ["manifold-gfx[desktop,offline,viz,svg,audio]"]

[tool.maturin]
# A maturin mixed project over the existing src/manifoldx package
# (https://www.maturin.rs/project_layout.html): the whole package ships in
# the manifold-gfx wheel, plus one compiled extension inside it. The name
# differs from the _native module the spike loader in manifoldx.native looks
# for, so the nbody/boids spikes keep working beside it. The runtime is not
# implemented yet; the extension's bootstrap says so from the Rust side.
python-source = "src"
module-name = "manifoldx._core_native"
manifest-path = "crates/manifoldx-python/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "F401", "I001", "F841", "E721"]

[build-system]
requires = ["maturin>=1.11,<2"]
build-backend = "maturin"

[dependency-groups]
browser = [
    "playwright>=1.55",
]
dev = [
    "pytest>=9.0.2",
    "pytest-async>=0.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
    "manifold-gfx[offline]",
    "pygltflib>=1.16.5",
]
docs = [
    "scriptorium",
]
# The native-wheel gate: maturin to build the wheel (make native-build).
native = [
    "maturin>=1.11,<2",
]

[tool.manifoldx.bench]
scenarios = "benchmarks.scenarios"
micro = ["benchmarks.suites.frame", "benchmarks.suites.ecs", "benchmarks.suites.compute", "benchmarks.suites.skinning",
         "benchmarks.suites.modeling", "benchmarks.suites.loaders", "benchmarks.suites.trace", "benchmarks.suites.startup",
         "benchmarks.suites.streaming", "benchmarks.suites.vehicles", "benchmarks.suites.web",
         "benchmarks.suites.audio"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/scenarios.py"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (CPU-heavy precompute; excluded from default `make test`)",
]
addopts = "-m 'not slow' -p manifoldx.bench.plugin"  # the plugin: benchmarks/scenarios.py::test_bench[name]

[tool.uv.sources]
scriptorium = { git = "https://github.com/apiad/scriptorium", rev = "v0.14.0" }
