[project]
name = "manifold-gfx"
version = "0.10.0"
description = "Real-time 3D rendering engine with ECS architecture, built on pure wgpu"
readme = "README.md"
authors = [
    { name = "Alejandro Piad", email = "apiad@apiad.net" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.4",
    "rendercanvas>=2.6.3",
    "tqdm>=4.67.3",
    "wgpu>=0.31.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
manifoldx = "manifoldx.cli:main"

[project.optional-dependencies]
desktop = ["glfw>=2.0"]
offline = [
    "imageio-ffmpeg>=0.5",
]
viz = ["pillow>=10.0"]
svg = ["thorvg-python>=1.1.3"]
all = ["manifold-gfx[desktop,offline,viz,svg]"]

[tool.hatch.build.targets.wheel]
packages = ["src/manifoldx"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "F401", "I001", "F841", "E721"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
browser = [
    "playwright>=1.55",
]
dev = [
    "pytest>=9.0.2",
    "pytest-async>=0.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
    "manifold-gfx[offline]",
    "pygltflib>=1.16.5",
]
docs = [
    "scriptorium",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (CPU-heavy precompute; excluded from default `make test`)",
]
addopts = "-m 'not slow'"

[tool.uv.sources]
scriptorium = { git = "https://github.com/apiad/scriptorium", rev = "v0.14.0" }
