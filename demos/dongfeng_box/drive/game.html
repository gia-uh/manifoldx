<style>

.btn{width:84px;height:84px;border-radius:20px;background:rgba(19,31,53,.82);color:#fff;display:grid;place-items:center;font-size:30px;border:2px solid rgba(255,255,255,.18);box-shadow:0 6px 18px rgba(19,31,53,.25);touch-action:none}
.btn.on{background:#2c4a7c;transform:scale(.96)}

.btn.brake{height:84px;width:84px;font-size:14px;font-weight:700;letter-spacing:.08em;background:rgba(80,86,98,.85)}
.rotate{position:fixed;inset:0;background:var(--ink);color:#fff;display:none;place-items:center;text-align:center;padding:30px;z-index:5}

@media (pointer:coarse){.hint .keys{display:none}}
@media (max-height:420px){.btn{width:70px;height:70px;font-size:26px}.btn.gas{height:100px;width:66px}.btn.brake{width:70px;height:70px}}

<script type="module">
// three.js and its GLTF loader travel inside this page (base64), so it opens offline from one file.
const b64 = (id) => atob(document.getElementById(id).textContent.trim());
const blobUrl = (code) => URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
const threeUrl = blobUrl(b64("src-three"));
const bguUrl = blobUrl(b64("src-bgu").replaceAll('from"three"', `from"${threeUrl}"`));
const gltfUrl = blobUrl(b64("src-gltf").replaceAll('from"three"', `from"${threeUrl}"`).replaceAll('"../utils/BufferGeometryUtils.js"', `"${bguUrl}"`));
const THREE = await import(threeUrl);
const { GLTFLoader } = await import(gltfUrl);

const CARS = {
  box: { id: "car-box", name: "BOX · prueba de manejo", wheelbase: 2.66, top: 140 / 3.6, accel: 3.6 },
  friday: { id: "car-friday", name: "Friday EV · prueba de manejo", wheelbase: 2.715, top: 180 / 3.6, accel: 4.2 },
};
// Phones pay for every pixel: no MSAA on dense screens, and the render scale adapts to hold the frame rate.
const dense = devicePixelRatio > 1.3;
const renderer = new THREE.WebGLRenderer({ antialias: !dense, powerPreference: "high-performance" });
const MAX_SCALE = Math.min(devicePixelRatio, dense ? 1.5 : 2), MIN_SCALE = 0.6;
let scale = Math.min(MAX_SCALE, dense ? 1.0 : devicePixelRatio);
renderer.setPixelRatio(scale);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#e9ebee");
scene.fog = new THREE.Fog("#e9ebee", 40, 120);

// A studio for the paint's reflections: a grey room with light panels, baked into an environment map.
const room = new THREE.Scene();
room.add(new THREE.Mesh(new THREE.BoxGeometry(30, 12, 30), new THREE.MeshBasicMaterial({ color: "#5d6168", side: THREE.BackSide })));
for (const [x, y, z, sx, sz] of [[0, 5.9, 0, 14, 8], [-14.9, 3, 0, 0.2, 10], [14.9, 3, 0, 0.2, 10]]) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(sx, sx < 1 ? 5 : 0.2, sz), new THREE.MeshBasicMaterial({ color: "#ffffff" }));
  p.position.set(x, y, z); room.add(p);
}
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(room, 0.04).texture;
scene.add(new THREE.HemisphereLight("#ffffff", "#9aa0a8", 0.6));
const sun = new THREE.DirectionalLight("#ffffff", 1.6);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 40 });
scene.add(sun, sun.target);

// The grounds: a dealer's test circuit (main straight, sweepers, a chicane, a hairpin, esses), a pit lane out of
// the showroom, cones to knock over, tyre walls to bounce off, and a low-poly city far away.
const ASPHALT = "#4a4f57", NAVY = "#131f35";
const floorTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d");
  g.fillStyle = "#d9ddd6"; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(40,60,40,${Math.random() * 0.05})`; g.fillRect(Math.random() * 256, Math.random() * 256, 2, 2); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(120, 120); t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const floor = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.MeshLambertMaterial({ map: floorTex }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
scene.fog = new THREE.Fog("#e9ebee", 90, 380);

const V = (x, z) => new THREE.Vector3(x, 0, z);
const TRACK = new THREE.CatmullRomCurve3([
  V(-90, 0), V(-30, 0), V(30, 0), V(90, 0), V(125, 15), V(137, 50), V(122, 80), V(106, 94), V(116, 110),
  V(102, 140), V(72, 152), V(54, 136), V(40, 110), V(10, 104), V(-20, 120), V(-52, 126), V(-92, 116),
  V(-126, 90), V(-137, 50), V(-126, 15),
], true, "centripetal");
const N = 900, HALF = 5;  // samples round the lap; half the road's width in metres
const pts = TRACK.getSpacedPoints(N).slice(0, N);
const tan = pts.map((_, i) => pts[(i + 1) % N].clone().sub(pts[(i + N - 1) % N]).normalize());
const nrm = tan.map((t) => new THREE.Vector3(-t.z, 0, t.x));  // to the left of travel

// A flat strip along a polyline, as one mesh; colours per quad when given.
function ribbon(points, normals, from, to, y, colorOf, closed) {
  const pos = [], col = [], idx = [];
  const n = points.length, last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const a = points[i], b = points[(i + 1) % n], na = normals[i], nb = normals[(i + 1) % n], v = pos.length / 3;
    for (const [p, q, off] of [[a, na, from], [a, na, to], [b, nb, from], [b, nb, to]]) pos.push(p.x + q.x * off, y, p.z + q.z * off);
    if (colorOf) { const c = colorOf(i); for (let k = 0; k < 4; k++) col.push(c.r, c.g, c.b); }
    idx.push(v, v + 1, v + 2, v + 1, v + 3, v + 2);  // counter-clockwise from above: faces up
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  if (colorOf) g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
const road = new THREE.Mesh(ribbon(pts, nrm, -HALF, HALF, 0.02, null, true), new THREE.MeshLambertMaterial({ color: ASPHALT }));
road.receiveShadow = true; scene.add(road);
const white = new THREE.Color("#f3f4f6"), navy = new THREE.Color(NAVY);
const curbColour = (i) => (Math.floor(i / 3) % 2 ? white : navy);
const curbMat = new THREE.MeshLambertMaterial({ vertexColors: true });
scene.add(new THREE.Mesh(ribbon(pts, nrm, HALF, HALF + 0.9, 0.03, curbColour, true), curbMat));
scene.add(new THREE.Mesh(ribbon(pts, nrm, -HALF - 0.9, -HALF, 0.03, curbColour, true), curbMat));
{ // the start line: a checkered strip across the road at sample 0's neighbourhood (x = 0 on the main straight)
  const c = document.createElement("canvas"); c.width = 160; c.height = 16; const g = c.getContext("2d");
  for (let i = 0; i < 20; i++) for (let j = 0; j < 2; j++) { g.fillStyle = (i + j) % 2 ? "#111" : "#fff"; g.fillRect(i * 8, j * 8, 8, 8); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter;
  const line = new THREE.Mesh(new THREE.PlaneGeometry(2 * HALF, 1.2), new THREE.MeshBasicMaterial({ map: t }));
  line.rotation.set(-Math.PI / 2, 0, Math.PI / 2); line.position.set(0, 0.04, 0); scene.add(line);
}
const startIdx = pts.reduce((best, p, i) => (Math.abs(p.x) + Math.abs(p.z) < Math.abs(pts[best].x) + Math.abs(pts[best].z) ? i : best), 0);

// The pit lane: out of the showroom's door, alongside the main straight, into the track after the start line.
const PIT = new THREE.CatmullRomCurve3([V(-62, -34), V(-56, -20), V(-35, -13), V(0, -12), V(30, -9), V(55, -4), V(75, -1)]);
const pitPts = PIT.getSpacedPoints(160);
const pitTan = pitPts.map((_, i) => pitPts[Math.min(i + 1, 160)].clone().sub(pitPts[Math.max(i - 1, 0)]).normalize());
const pitNrm = pitTan.map((t) => new THREE.Vector3(-t.z, 0, t.x));
const pit = new THREE.Mesh(ribbon(pitPts, pitNrm, -3.6, 3.6, 0.015, null, false), new THREE.MeshLambertMaterial({ color: "#5a6069" }));
pit.receiveShadow = true; scene.add(pit);
const apron = new THREE.Mesh(new THREE.PlaneGeometry(40, 18), new THREE.MeshLambertMaterial({ color: "#c7cbd1" }));
apron.rotation.x = -Math.PI / 2; apron.position.set(-62, 0.012, -42); apron.receiveShadow = true; scene.add(apron);

// The showroom: a glass box under a navy roof slab, with the brand across the fascia.
const solids = []; // circles the car bounces off: {x, z, r}
{
  const g = new THREE.Group();
  const glass = new THREE.Mesh(new THREE.BoxGeometry(34, 7, 16), new THREE.MeshStandardMaterial({ color: "#26354d", roughness: 0.08, metalness: 0.6 }));
  glass.position.y = 3.5; g.add(glass);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(38, 1.2, 20), new THREE.MeshLambertMaterial({ color: NAVY }));
  roof.position.y = 7.6; roof.castShadow = true; g.add(roof);
  for (const x of [-18, 18]) for (const z of [-9, 9]) {
    const col = new THREE.Mesh(new THREE.BoxGeometry(0.6, 7, 0.6), new THREE.MeshLambertMaterial({ color: "#e6e8eb" }));
    col.position.set(x, 3.5, z); g.add(col);
  }
  const c = document.createElement("canvas"); c.width = 512; c.height = 64; const x = c.getContext("2d");
  x.fillStyle = NAVY; x.fillRect(0, 0, 512, 64); x.fillStyle = "#fff"; x.font = "700 40px system-ui,sans-serif";
  x.textAlign = "center"; x.textBaseline = "middle"; x.letterSpacing = "10px"; x.fillText("DONGFENG", 256, 34);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(16, 2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c) }));
  sign.material.map.colorSpace = THREE.SRGBColorSpace; sign.position.set(0, 7.6, 10.05); g.add(sign);
  g.position.set(-62, 0, -60); scene.add(g);
  for (let k = -16; k <= 16; k += 4) solids.push({ x: -62 + k, z: -52, r: 2.2 });  // its front wall, as bumpers
}

// Tyre walls on the outside of the fast corners, and cones: a slalom on the back straight and the chicane's apexes.
const tyreGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.28, 12), tyreMat = new THREE.MeshLambertMaterial({ color: "#1d1f22" });
const tyreTop = new THREE.MeshLambertMaterial({ color: "#f3f4f6" });
const stacks = [];
const along = (i, off) => pts[(i + N) % N].clone().addScaledVector(nrm[(i + N) % N], off);
const outside = (i) => -Math.sign(nrm[i].clone().dot(tan[(i + 8) % N].clone().sub(tan[(i + N - 8) % N])) || 1);
for (const at of [0.12, 0.16, 0.38, 0.45, 0.82, 0.88]) {
  const i0 = Math.floor(at * N), side = outside(i0);
  for (let k = -12; k <= 12; k += 3) {
    const p = along(i0 + k, side * (HALF + 3.2));
    stacks.push(p); solids.push({ x: p.x, z: p.z, r: 0.5 });
  }
}
const tyres = new THREE.InstancedMesh(tyreGeo, tyreMat, stacks.length * 3);
{ const m = new THREE.Object3D(); let n = 0;
  for (const s of stacks) for (let h = 0; h < 3; h++) { m.position.set(s.x, 0.14 + h * 0.28, s.z); m.updateMatrix(); tyres.setMatrixAt(n++, m.matrix); } }
tyres.castShadow = true; scene.add(tyres);

const coneGeo = new THREE.ConeGeometry(0.22, 0.6, 14), coneMat = new THREE.MeshLambertMaterial({ color: "#e8682a" });
const stripe = new THREE.MeshLambertMaterial({ color: "#ffffff" });
const cones = [];
const addCone = (p) => {
  const g = new THREE.Group();
  const c = new THREE.Mesh(coneGeo, coneMat); c.position.y = 0.3; g.add(c);
  const s = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.14, 0.09, 14), stripe); s.position.y = 0.36; g.add(s);
  g.position.copy(p); scene.add(g);
  cones.push({ g, vx: 0, vz: 0, spin: 0, home: p.clone() });
};
{ const i0 = Math.floor(0.66 * N); for (let k = 0; k < 8; k++) addCone(along(i0 + k * 7, (k % 2 ? 1 : -1) * 1.8)); }
for (const at of [0.30, 0.33]) addCone(along(Math.floor(at * N), -outside(Math.floor(at * N)) * (HALF - 0.6)));

// Low-poly trees near the track and a city far off: instanced, flat-shaded, faded by the fog.
{
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.15, 0.2, 1.4, 6), new THREE.MeshLambertMaterial({ color: "#7a6a58" }), 90);
  const crown = new THREE.InstancedMesh(new THREE.ConeGeometry(1.6, 4.2, 7), new THREE.MeshLambertMaterial({ color: "#6f8f74", flatShading: true }), 90);
  const m = new THREE.Object3D(); let n = 0, tries = 0;
  while (n < 90 && tries++ < 4000) {
    const x = (Math.random() - 0.5) * 360, z = (Math.random() - 0.5) * 300;
    let near = Infinity; for (let i = 0; i < N; i += 6) near = Math.min(near, Math.hypot(pts[i].x - x, pts[i].z - z));
    if (near < HALF + 9 || Math.hypot(x + 62, z + 50) < 30 || (z < -2 && z > -24 && x > -70 && x < 80)) continue;
    const s = 0.7 + Math.random() * 0.8;
    m.scale.set(s, s, s); m.position.set(x, 0.7 * s, z); m.updateMatrix(); trunk.setMatrixAt(n, m.matrix);
    m.position.set(x, (1.4 + 2.1) * s, z); m.updateMatrix(); crown.setMatrixAt(n, m.matrix); n++;
  }
  trunk.count = crown.count = n; crown.castShadow = true; scene.add(trunk, crown);
  const city = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ flatShading: true }), 140);
  const tones = ["#c9ced6", "#b7bec9", "#d8dce2", "#a9b3c2", "#8e9aad", "#cfd4db"].map((c) => new THREE.Color(c));
  for (let i = 0; i < 140; i++) {
    const a = (i / 140) * Math.PI * 2 + Math.random() * 0.03, r = 230 + Math.random() * 90;
    const w = 10 + Math.random() * 18, d = 10 + Math.random() * 18, h = 12 + Math.random() ** 2 * 70;
    m.scale.set(w, h, d); m.rotation.set(0, Math.random() * Math.PI, 0); m.position.set(Math.cos(a) * r, h / 2, Math.sin(a) * r);
    m.updateMatrix(); city.setMatrixAt(i, m.matrix); city.setColorAt(i, tones[i % tones.length]);
  }
  scene.add(city);
}

// The car: a GLB from manifoldx. Its floor disc goes; wheels spin about their axle and the front ones steer.
const loader = new GLTFLoader();
const loadCar = (key) => new Promise((ok, fail) => {
  const bin = b64(CARS[key].id), buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  loader.parse(buf.buffer, "", (gltf) => {
    const model = gltf.scene, wheels = [], drop = [];
    model.traverse((o) => {
      if (!o.isMesh) return;
      o.geometry.computeBoundingSphere();
      if (o.geometry.boundingSphere.radius > 4) { drop.push(o); return; }
      o.castShadow = true;
      if (o.material.map) o.material.map.anisotropy = 4;
      if (o.geometry.boundingSphere.radius < 0.5 && Math.abs(o.position.y - 0.33) < 0.12) {
        const base = o.quaternion.clone();
        wheels.push({ o, base, flip: Math.abs(base.y) > 0.5 ? -1 : 1, front: o.position.x < 0 });
      }
    });
    drop.forEach((o) => o.parent.remove(o));
    ok({ model, wheels });
  }, fail);
});

const car = new THREE.Group(); scene.add(car);
const headingOf = (t) => Math.atan2(t.z, -t.x);  // forward is (-cos h, sin h)
const START = { x: pitPts[0].x, z: pitPts[0].z, heading: headingOf(pitTan[0]) };
const state = { ...START, v: 0, steer: 0, spin: 0 };
// Where the car is on the lap: the nearest sample, searched near the last one.
const lap = { idx: -1, n: 0, start: 0, best: Infinity, last: 0, marks: new Set(), running: false, offTrack: false };
function nearest(x, z, from, span) {
  let best = from, bd = Infinity;
  for (let k = -span; k <= span; k++) { const i = (from + k + N) % N, d = (pts[i].x - x) ** 2 + (pts[i].z - z) ** 2; if (d < bd) { bd = d; best = i; } }
  return [best, Math.sqrt(bd)];
}
const onPit = (x, z) => pitPts.some((p) => (p.x - x) ** 2 + (p.z - z) ** 2 < 4.2 ** 2);
let current = "box", wheels = [];
async function useCar(key) {
  const { model, wheels: w } = await loadCar(key);
  car.clear(); car.add(model); wheels = w; current = key;
  document.getElementById("model").textContent = CARS[key].name;
}

// Input: on-screen pedals and steering (multi-touch), keyboard on a desktop.
const keys = { left: false, right: false, gas: false, brake: false };
const held = new Map();
for (const el of document.querySelectorAll(".btn")) {
  const k = el.dataset.k;
  const down = (e) => { e.preventDefault(); el.setPointerCapture?.(e.pointerId); held.set(e.pointerId, k); keys[k] = true; el.classList.add("on"); };
  const up = (e) => { if (held.get(e.pointerId) !== k) return; held.delete(e.pointerId); if (![...held.values()].includes(k)) { keys[k] = false; el.classList.remove("on"); } };
  el.addEventListener("pointerdown", down);
  for (const t of ["pointerup", "pointercancel", "lostpointercapture"]) el.addEventListener(t, up);
}
const keyMap = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", ArrowUp: "gas", KeyW: "gas", ArrowDown: "brake", KeyS: "brake", Space: "brake" };
addEventListener("keydown", (e) => { if (keyMap[e.code]) { keys[keyMap[e.code]] = true; e.preventDefault(); } if (e.code === "KeyC") nextCam(); });
addEventListener("keyup", (e) => { if (keyMap[e.code]) keys[keyMap[e.code]] = false; });
const auto = new URLSearchParams(location.search).get("auto");
const overview = new URLSearchParams(location.search).get("overview");  // a fixed view from above, for checks
const simSteps = Number(new URLSearchParams(location.search).get("sim") || 1);  // steps per frame, for headless checks  // ?auto=1 drives itself, for a headless check
const cams = [{ back: 7.5, up: 2.6, look: 1.0 }, { back: 4.2, up: 1.5, look: 0.9 }, { back: 13, up: 7.5, look: 0 }];
let cam = 0; const nextCam = () => { cam = (cam + 1) % cams.length; };
document.getElementById("cam").onclick = nextCam;
document.getElementById("reset").onclick = () => {
  Object.assign(state, START, { v: 0, steer: 0 }); Object.assign(lap, { idx: -1, running: false, marks: new Set() });
  for (const c of cones) { c.g.position.copy(c.home); c.g.rotation.set(0, 0, 0); c.vx = c.vz = c.spin = 0; }
};
document.getElementById("swap").onclick = () => useCar(current === "box" ? "friday" : "box");
document.getElementById("fs").onclick = async () => {
  try { await document.documentElement.requestFullscreen(); await screen.orientation?.lock?.("landscape"); } catch {}
};

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 300);
addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

const qSteer = new THREE.Quaternion(), qSpin = new THREE.Quaternion(), Y = new THREE.Vector3(0, 1, 0), Z = new THREE.Vector3(0, 0, 1);
const fmt = (s) => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, "0")}`;
const lapEl = document.getElementById("lap");
let simClock = 0;  // seconds of driving: laps are timed on it, so a slow frame never shortens a lap
function updateLap() {
  const now = simClock;
  const [i, d] = lap.idx < 0 ? nearest(state.x, state.z, 0, N / 2) : nearest(state.x, state.z, lap.idx, 40);
  lap.offTrack = d > HALF + 1.2 && !onPit(state.x, state.z);
  if (d < HALF + 1.5) {
    if (lap.idx < 0) { lap.running = true; lap.start = now; lap.marks.clear(); }  // out of the pits: the clock starts
    for (const q of [1, 2, 3]) if (Math.abs(i - (startIdx + (q * N) / 4)) % N < 20) lap.marks.add(q);
    const crossed = lap.idx >= 0 && ((lap.idx - startIdx + N) % N) > N * 0.9 && ((i - startIdx + N) % N) < N * 0.1;
    if (crossed && lap.marks.size === 3) {
      lap.last = now - lap.start; lap.best = Math.min(lap.best, lap.last); lap.n++; lap.start = now; lap.marks.clear();
    }
    lap.idx = i;
  }
  const cur = lap.running ? fmt(now - lap.start) : "en pits";
  const txt = `Vuelta ${lap.n + 1} · ${cur}${lap.best < Infinity ? ` · mejor ${fmt(lap.best)}` : ""}`;
  if (txt !== lapEl.textContent) lapEl.textContent = txt;
}
// Arcade driving: a bicycle model with speed-sensitive steering, rolling drag and a soft bump off solids.
function step(dt) {
  simClock += dt;
  const spec = CARS[current];
  const gas = keys.gas || auto, brake = keys.brake;
  let steerIn = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
  if (auto) {  // follow the pit lane, then the racing line, by aiming at a point ahead
    const aim = lap.idx < 0 ? pitPts[Math.min(160, pitPts.findIndex((p) => Math.hypot(p.x - state.x, p.z - state.z) < 6) + 10)] : pts[(lap.idx + 14) % N];
    const want = Math.atan2(aim.z - state.z, -(aim.x - state.x));
    let d = want - state.heading; d = Math.atan2(Math.sin(d), Math.cos(d));
    steerIn = Math.max(-1, Math.min(1, d * 2.5));
  }
  const maxSteer = 0.6 / (1 + Math.abs(state.v) / 9);
  state.steer += (steerIn * maxSteer - state.steer) * Math.min(1, dt * 7);
  if (gas) state.v += spec.accel * dt * (1 - Math.max(0, state.v) / spec.top);
  if (brake) state.v -= (state.v > 0.3 ? 9 : 2.5) * dt;
  state.v = Math.max(-5, state.v);
  const grass = lap.offTrack ? 1.4 : 0;  // the verge slows you down hard
  state.v -= state.v * (0.12 + grass) * dt + Math.sign(state.v) * Math.min(Math.abs(state.v), 0.35 * dt);
  state.heading += (state.v / spec.wheelbase) * Math.tan(state.steer) * dt;
  const fx = -Math.cos(state.heading), fz = Math.sin(state.heading);
  state.x += fx * state.v * dt; state.z += fz * state.v * dt;
  for (const s of solids) {
    const dx = state.x - s.x, dz = state.z - s.z, d = Math.hypot(dx, dz), min = s.r + 1.0;
    if (d < min) { state.x = s.x + (dx / d) * min; state.z = s.z + (dz / d) * min; state.v *= -0.25; }
  }
  updateLap();
  const lim = 300; state.x = Math.max(-lim, Math.min(lim, state.x)); state.z = Math.max(-lim, Math.min(lim, state.z));
  drawMap();
  for (const c of cones) {
    const dx = c.g.position.x - state.x, dz = c.g.position.z - state.z, d = Math.hypot(dx, dz);
    if (d < 1.4 && Math.abs(state.v) > 0.5) { c.vx += (dx / d) * Math.abs(state.v) * 0.8; c.vz += (dz / d) * Math.abs(state.v) * 0.8; c.spin = 6; }
    c.g.position.x += c.vx * dt; c.g.position.z += c.vz * dt; c.vx *= 1 - Math.min(1, dt * 2.5); c.vz *= 1 - Math.min(1, dt * 2.5);
    if (c.spin > 0) { c.g.rotation.z += c.spin * dt; c.spin -= dt * 4; } else if (Math.abs(c.g.rotation.z) > 0.01) c.g.rotation.z = Math.min(Math.PI / 2, Math.abs(c.g.rotation.z));
  }
  car.position.set(state.x, 0, state.z); car.rotation.y = state.heading;
  state.spin += (state.v / 0.33) * dt;
  // Rolling forward (-x) turns a wheel about +z; a face loaded turned 180° about y spins the other way locally.
  for (const w of wheels) {
    qSteer.setFromAxisAngle(Y, w.front ? state.steer : 0); qSpin.setFromAxisAngle(Z, state.spin * w.flip);
    w.o.quaternion.copy(qSteer).multiply(w.base).multiply(qSpin);
  }
  // A little body roll and pitch sell the motion.
  car.children[0] && (car.children[0].rotation.x = -state.steer * Math.min(1, Math.abs(state.v) / 15) * 0.05);
  if (overview) { scene.fog = null; camera.far = 1500; camera.updateProjectionMatrix(); camera.position.set(0, 330, 75); camera.lookAt(0, 0, 70); } else {
  const c = cams[cam], back = c.back, tx = state.x - fx * back, tz = state.z - fz * back;
  camera.position.lerp(camGoal.set(tx, c.up, tz), Math.min(1, dt * 3.5));
  camera.lookAt(state.x + fx * 2, c.look, state.z + fz * 2);
  }
  sun.position.set(state.x - 8, 18, state.z + 6); sun.target.position.set(state.x, 0, state.z);
  const kmh = Math.round(Math.abs(state.v) * 3.6);
  if (kmh !== shownKmh) { kmhEl.textContent = kmh; shownKmh = kmh; }
}
const map = document.getElementById("map"), mg = map.getContext("2d");
const bounds = pts.concat(pitPts).reduce((b, p) => [Math.min(b[0], p.x), Math.max(b[1], p.x), Math.min(b[2], p.z), Math.max(b[3], p.z)], [1e9, -1e9, 1e9, -1e9]);
const mapXY = (x, z) => { const s = Math.min((map.width - 16) / (bounds[1] - bounds[0]), (map.height - 16) / (bounds[3] - bounds[2]));
  return [8 + (x - bounds[0]) * s, 8 + (z - bounds[2]) * s]; };
const mapBase = (() => { const c = document.createElement("canvas"); c.width = map.width; c.height = map.height; const g = c.getContext("2d");
  g.lineCap = g.lineJoin = "round";
  for (const [line, w, col] of [[pts, 7, "rgba(19,31,53,.85)"], [pitPts, 4, "rgba(19,31,53,.45)"]]) {
    g.strokeStyle = col; g.lineWidth = w; g.beginPath(); line.forEach((p, i) => (i ? g.lineTo : g.moveTo).call(g, ...mapXY(p.x, p.z)));
    if (line === pts) g.closePath(); g.stroke();
  }
  return c; })();
function drawMap() {
  mg.clearRect(0, 0, map.width, map.height); mg.drawImage(mapBase, 0, 0);
  const [x, y] = mapXY(state.x, state.z); mg.fillStyle = "#e8682a"; mg.beginPath(); mg.arc(x, y, 4, 0, 7); mg.fill();
}
const camGoal = new THREE.Vector3(), kmhEl = document.getElementById("kmh"); let shownKmh = -1;

// Every 1.5 s, step the render scale down when frames are slow and back up when there is room.
const perf = { frames: 0, since: performance.now(), fps: 0 };
const fpsEl = document.getElementById("fps");
function adapt(now) {
  perf.frames++;
  if (now - perf.since < 1500) return;
  perf.fps = (perf.frames * 1000) / (now - perf.since); perf.frames = 0; perf.since = now;
  let next = scale;
  if (perf.fps < 45 && scale > MIN_SCALE) next = Math.max(MIN_SCALE, scale * 0.8);
  else if (perf.fps > 58 && scale < MAX_SCALE) next = Math.min(MAX_SCALE, scale * 1.1);
  if (next !== scale) { scale = next; renderer.setPixelRatio(scale); renderer.setSize(innerWidth, innerHeight); }
  fpsEl.textContent = `${Math.round(perf.fps)} fps · ${scale.toFixed(2)}×`;
}
window.__perf = () => ({ fps: perf.fps, scale, calls: renderer.info.render.calls, tris: renderer.info.render.triangles });

await useCar("box");
camera.position.set(state.x + 4, 3, state.z - 8);
document.getElementById("loading").remove();
let last = performance.now();
renderer.setAnimationLoop((now) => { const dt = Math.min(0.05, (now - last) / 1000); last = now; for (let k = 0; k < simSteps; k++) step(dt); renderer.render(scene, camera); adapt(now); });
window.__ready = true;
</script></body></html>
