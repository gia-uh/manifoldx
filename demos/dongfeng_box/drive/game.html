<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#131f35"><meta name="mobile-web-app-capable" content="yes">
<title>Dongfeng · prueba de manejo</title>
<style>
:root{--ink:#131f35;--paper:#eef0f3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none}
canvas{display:block;position:fixed;inset:0}
.hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;color:var(--ink)}
.brand{font-weight:700;letter-spacing:.14em;font-size:13px}.brand small{display:block;font-weight:500;letter-spacing:.02em;opacity:.65;font-size:12px;margin-top:2px}
.speed{text-align:right;font-variant-numeric:tabular-nums}.speed b{font-size:34px;line-height:1}.speed span{font-size:12px;opacity:.65;display:block}
.top-btns{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:8px}
.chip{pointer-events:auto;border:1px solid rgba(19,31,53,.25);background:rgba(255,255,255,.8);color:var(--ink);border-radius:18px;padding:7px 12px;font-size:13px;font-weight:600}
.pad{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:14px}
.pad.left{left:max(18px,env(safe-area-inset-left))}.pad.right{right:max(18px,env(safe-area-inset-right));align-items:flex-end}
.btn{width:84px;height:84px;border-radius:20px;background:rgba(19,31,53,.82);color:#fff;display:grid;place-items:center;font-size:30px;border:2px solid rgba(255,255,255,.18);box-shadow:0 6px 18px rgba(19,31,53,.25);touch-action:none}
.btn.on{background:#2c4a7c;transform:scale(.96)}
.btn.gas{height:118px;width:76px;border-radius:16px;font-size:14px;font-weight:700;letter-spacing:.08em}
.btn.brake{height:84px;width:84px;font-size:14px;font-weight:700;letter-spacing:.08em;background:rgba(80,86,98,.85)}
.rotate{position:fixed;inset:0;background:var(--ink);color:#fff;display:none;place-items:center;text-align:center;padding:30px;z-index:5}
.rotate div{max-width:280px;font-size:17px;line-height:1.45}.rotate svg{width:72px;height:72px;margin-bottom:14px;animation:tilt 2.2s ease-in-out infinite}
@keyframes tilt{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (orientation:portrait) and (pointer:coarse){.rotate{display:grid}}
.loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--ink);font-weight:600;letter-spacing:.1em;font-size:13px;z-index:4;background:var(--paper)}
.hint{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:var(--ink);opacity:.6;font-size:12px;pointer-events:none;text-align:center}
@media (pointer:coarse){.hint .keys{display:none}}
@media (max-height:420px){.btn{width:70px;height:70px;font-size:26px}.btn.gas{height:100px;width:66px}.btn.brake{width:70px;height:70px}}
</style></head><body>
<div class="loading" id="loading">CARGANDO…</div>
<div class="hud"><div class="brand">DONGFENG<small id="model">BOX · prueba de manejo</small></div><div class="speed"><b id="kmh">0</b><span>km/h</span></div></div>
<div class="top-btns"><button class="chip" id="swap">Cambiar carro</button><button class="chip" id="cam">Cámara</button><button class="chip" id="fs">Pantalla completa</button></div>
<div class="pad left"><div class="btn" data-k="left">◀</div><div class="btn" data-k="right">▶</div></div>
<div class="pad right"><div class="btn brake" data-k="brake">FRENO</div><div class="btn gas" data-k="gas">GAS</div></div>
<div class="hint"><span class="keys">Teclado: flechas o WASD · C cambia la cámara</span></div>
<div class="rotate"><div><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><br>Gira el teléfono para manejar</div></div>
<script id="src-three" type="text/plain">__THREE__</script>
<script id="src-bgu" type="text/plain">__BGU__</script>
<script id="src-gltf" type="text/plain">__GLTF__</script>
<script id="car-box" type="text/plain">__CAR_BOX__</script>
<script id="car-friday" type="text/plain">__CAR_FRIDAY__</script>
<script type="module">
// three.js and its GLTF loader travel inside this page (base64), so it opens offline from one file.
const b64 = (id) => atob(document.getElementById(id).textContent.trim());
const blobUrl = (code) => URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
const threeUrl = blobUrl(b64("src-three"));
const bguUrl = blobUrl(b64("src-bgu").replaceAll('from"three"', `from"${threeUrl}"`));
const gltfUrl = blobUrl(b64("src-gltf").replaceAll('from"three"', `from"${threeUrl}"`).replaceAll('"../utils/BufferGeometryUtils.js"', `"${bguUrl}"`));
const THREE = await import(threeUrl);
const { GLTFLoader } = await import(gltfUrl);

const CARS = {
  box: { id: "car-box", name: "BOX · prueba de manejo", wheelbase: 2.66, top: 140 / 3.6, accel: 3.6 },
  friday: { id: "car-friday", name: "Friday EV · prueba de manejo", wheelbase: 2.715, top: 180 / 3.6, accel: 4.2 },
};
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#e9ebee");
scene.fog = new THREE.Fog("#e9ebee", 40, 120);

// A studio for the paint's reflections: a grey room with light panels, baked into an environment map.
const room = new THREE.Scene();
room.add(new THREE.Mesh(new THREE.BoxGeometry(30, 12, 30), new THREE.MeshBasicMaterial({ color: "#5d6168", side: THREE.BackSide })));
for (const [x, y, z, sx, sz] of [[0, 5.9, 0, 14, 8], [-14.9, 3, 0, 0.2, 10], [14.9, 3, 0, 0.2, 10]]) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(sx, sx < 1 ? 5 : 0.2, sz), new THREE.MeshBasicMaterial({ color: "#ffffff" }));
  p.position.set(x, y, z); room.add(p);
}
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(room, 0.04).texture;
scene.add(new THREE.HemisphereLight("#ffffff", "#9aa0a8", 0.6));
const sun = new THREE.DirectionalLight("#ffffff", 1.6);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 60 });
scene.add(sun, sun.target);

// The grounds: a pale concrete floor with a faint grid, a ring road, cones and a few plinths.
const floorTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 512; const g = c.getContext("2d");
  g.fillStyle = "#dfe2e6"; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.035})`; g.fillRect(Math.random() * 512, Math.random() * 512, 2, 2); }
  g.strokeStyle = "rgba(19,31,53,.10)"; g.lineWidth = 2; g.strokeRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(40, 40); t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8; return t;
})();
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.92 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const R_IN = 14, R_OUT = 22;
const road = new THREE.Mesh(new THREE.RingGeometry(R_IN, R_OUT, 128, 1), new THREE.MeshStandardMaterial({ color: "#4a4f57", roughness: 0.85 }));
road.rotation.x = -Math.PI / 2; road.position.y = 0.005; road.receiveShadow = true; scene.add(road);
for (const r of [R_IN + 0.25, R_OUT - 0.25]) {
  const line = new THREE.Mesh(new THREE.RingGeometry(r - 0.08, r + 0.08, 128, 1), new THREE.MeshBasicMaterial({ color: "#f3f4f6" }));
  line.rotation.x = -Math.PI / 2; line.position.y = 0.01; scene.add(line);
}
for (let i = 0; i < 48; i++) {
  if (i % 2) continue;
  const a = (i / 48) * Math.PI * 2, r = (R_IN + R_OUT) / 2;
  const dash = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.14), new THREE.MeshBasicMaterial({ color: "#f3f4f6" }));
  dash.rotation.set(-Math.PI / 2, 0, -a + Math.PI / 2); dash.position.set(Math.cos(a) * r, 0.012, Math.sin(a) * r); scene.add(dash);
}
const solids = []; // circles the car bumps into: {x, z, r}
const coneGeo = new THREE.ConeGeometry(0.22, 0.6, 18), coneMat = new THREE.MeshStandardMaterial({ color: "#e8682a", roughness: 0.6 });
const stripe = new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.5 });
const cones = [];
for (let i = 0; i < 30; i++) {
  const a = (i / 30) * Math.PI * 2, r = i % 2 ? R_IN - 1.2 : R_OUT + 1.2;
  const g = new THREE.Group();
  const c = new THREE.Mesh(coneGeo, coneMat); c.position.y = 0.3; c.castShadow = true; g.add(c);
  const s = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.14, 0.09, 18), stripe); s.position.y = 0.36; g.add(s);
  g.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); scene.add(g);
  cones.push({ g, vx: 0, vz: 0, spin: 0 });
}
const plinthMat = new THREE.MeshStandardMaterial({ color: "#131f35", roughness: 0.4, metalness: 0.2 });
for (const [x, z] of [[0, 0], [-5, 4], [5, -4]]) {
  const p = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.4, 0.25, 64), plinthMat);
  p.position.set(x, 0.125, z); p.receiveShadow = p.castShadow = true; scene.add(p);
  solids.push({ x, z, r: 2.4 });
}

// The car: a GLB from manifoldx. Its floor disc goes; wheels spin about their axle and the front ones steer.
const loader = new GLTFLoader();
const loadCar = (key) => new Promise((ok, fail) => {
  const bin = b64(CARS[key].id), buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  loader.parse(buf.buffer, "", (gltf) => {
    const model = gltf.scene, wheels = [], drop = [];
    model.traverse((o) => {
      if (!o.isMesh) return;
      o.geometry.computeBoundingSphere();
      if (o.geometry.boundingSphere.radius > 4) { drop.push(o); return; }
      o.castShadow = true; o.receiveShadow = true;
      if (o.material.map) o.material.map.anisotropy = 8;
      if (o.geometry.boundingSphere.radius < 0.5 && Math.abs(o.position.y - 0.33) < 0.12) {
        const base = o.quaternion.clone();
        wheels.push({ o, base, flip: Math.abs(base.y) > 0.5 ? -1 : 1, front: o.position.x < 0 });
      }
    });
    drop.forEach((o) => o.parent.remove(o));
    ok({ model, wheels });
  }, fail);
});

const car = new THREE.Group(); scene.add(car);
const state = { x: (R_IN + R_OUT) / 2, z: 0, heading: Math.PI / 2, v: 0, steer: 0, spin: 0 };
let current = "box", wheels = [];
async function useCar(key) {
  const { model, wheels: w } = await loadCar(key);
  car.clear(); car.add(model); wheels = w; current = key;
  document.getElementById("model").textContent = CARS[key].name;
}

// Input: on-screen pedals and steering (multi-touch), keyboard on a desktop.
const keys = { left: false, right: false, gas: false, brake: false };
const held = new Map();
for (const el of document.querySelectorAll(".btn")) {
  const k = el.dataset.k;
  const down = (e) => { e.preventDefault(); el.setPointerCapture?.(e.pointerId); held.set(e.pointerId, k); keys[k] = true; el.classList.add("on"); };
  const up = (e) => { if (held.get(e.pointerId) !== k) return; held.delete(e.pointerId); if (![...held.values()].includes(k)) { keys[k] = false; el.classList.remove("on"); } };
  el.addEventListener("pointerdown", down);
  for (const t of ["pointerup", "pointercancel", "lostpointercapture"]) el.addEventListener(t, up);
}
const keyMap = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", ArrowUp: "gas", KeyW: "gas", ArrowDown: "brake", KeyS: "brake", Space: "brake" };
addEventListener("keydown", (e) => { if (keyMap[e.code]) { keys[keyMap[e.code]] = true; e.preventDefault(); } if (e.code === "KeyC") nextCam(); });
addEventListener("keyup", (e) => { if (keyMap[e.code]) keys[keyMap[e.code]] = false; });
const auto = new URLSearchParams(location.search).get("auto");  // ?auto=1 drives itself, for a headless check
const cams = [{ back: 7.5, up: 2.6, look: 1.0 }, { back: 4.2, up: 1.5, look: 0.9 }, { back: 13, up: 7.5, look: 0 }];
let cam = 0; const nextCam = () => { cam = (cam + 1) % cams.length; };
document.getElementById("cam").onclick = nextCam;
document.getElementById("swap").onclick = () => useCar(current === "box" ? "friday" : "box");
document.getElementById("fs").onclick = async () => {
  try { await document.documentElement.requestFullscreen(); await screen.orientation?.lock?.("landscape"); } catch {}
};

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 300);
addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

const qSteer = new THREE.Quaternion(), qSpin = new THREE.Quaternion(), Y = new THREE.Vector3(0, 1, 0), Z = new THREE.Vector3(0, 0, 1);
// Arcade driving: a bicycle model with speed-sensitive steering, rolling drag and a soft bump off solids.
function step(dt) {
  const spec = CARS[current];
  const gas = keys.gas || auto, brake = keys.brake;
  const steerIn = (keys.left ? 1 : 0) - (keys.right ? 1 : 0) + (auto ? 0.42 : 0);
  const maxSteer = 0.6 / (1 + Math.abs(state.v) / 9);
  state.steer += (steerIn * maxSteer - state.steer) * Math.min(1, dt * 7);
  if (gas) state.v += spec.accel * dt * (1 - Math.max(0, state.v) / spec.top);
  if (brake) state.v -= (state.v > 0.3 ? 9 : 2.5) * dt;
  state.v = Math.max(-5, state.v);
  state.v -= state.v * 0.12 * dt + Math.sign(state.v) * Math.min(Math.abs(state.v), 0.35 * dt);
  state.heading += (state.v / spec.wheelbase) * Math.tan(state.steer) * dt;
  const fx = -Math.cos(state.heading), fz = Math.sin(state.heading);
  state.x += fx * state.v * dt; state.z += fz * state.v * dt;
  for (const s of solids) {
    const dx = state.x - s.x, dz = state.z - s.z, d = Math.hypot(dx, dz), min = s.r + 1.0;
    if (d < min) { state.x = s.x + (dx / d) * min; state.z = s.z + (dz / d) * min; state.v *= -0.25; }
  }
  const lim = 90; state.x = Math.max(-lim, Math.min(lim, state.x)); state.z = Math.max(-lim, Math.min(lim, state.z));
  for (const c of cones) {
    const dx = c.g.position.x - state.x, dz = c.g.position.z - state.z, d = Math.hypot(dx, dz);
    if (d < 1.4 && Math.abs(state.v) > 0.5) { c.vx += (dx / d) * Math.abs(state.v) * 0.8; c.vz += (dz / d) * Math.abs(state.v) * 0.8; c.spin = 6; }
    c.g.position.x += c.vx * dt; c.g.position.z += c.vz * dt; c.vx *= 1 - Math.min(1, dt * 2.5); c.vz *= 1 - Math.min(1, dt * 2.5);
    if (c.spin > 0) { c.g.rotation.z += c.spin * dt; c.spin -= dt * 4; } else if (Math.abs(c.g.rotation.z) > 0.01) c.g.rotation.z = Math.min(Math.PI / 2, Math.abs(c.g.rotation.z));
  }
  car.position.set(state.x, 0, state.z); car.rotation.y = state.heading;
  state.spin += (state.v / 0.33) * dt;
  // Rolling forward (-x) turns a wheel about +z; a face loaded turned 180° about y spins the other way locally.
  for (const w of wheels) {
    qSteer.setFromAxisAngle(Y, w.front ? state.steer : 0); qSpin.setFromAxisAngle(Z, state.spin * w.flip);
    w.o.quaternion.copy(qSteer).multiply(w.base).multiply(qSpin);
  }
  // A little body roll and pitch sell the motion.
  car.children[0] && (car.children[0].rotation.x = -state.steer * Math.min(1, Math.abs(state.v) / 15) * 0.05);
  const c = cams[cam], back = c.back, tx = state.x - fx * back, tz = state.z - fz * back;
  camera.position.lerp(new THREE.Vector3(tx, c.up, tz), Math.min(1, dt * 3.5));
  camera.lookAt(state.x + fx * 2, c.look, state.z + fz * 2);
  sun.position.set(state.x - 8, 18, state.z + 6); sun.target.position.set(state.x, 0, state.z);
  document.getElementById("kmh").textContent = Math.round(Math.abs(state.v) * 3.6);
}

await useCar("box");
camera.position.set(state.x + 7, 3, state.z);
document.getElementById("loading").remove();
let last = performance.now();
renderer.setAnimationLoop((now) => { const dt = Math.min(0.05, (now - last) / 1000); last = now; step(dt); renderer.render(scene, camera); });
window.__ready = true;
</script></body></html>
