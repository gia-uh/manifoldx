name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        # Offline backend for headless rendering, Pillow (viz) for the texture
        # tests. The runner has no GPU: tests/conftest.py turns every GPU
        # adapter request into a skip, so render tests skip instead of erroring.
        run: uv sync --extra offline --extra viz --extra svg --dev

      - name: Run tests
        # Tests should pass with OFFSCREEN backend only
        run: uv run pytest tests/ -v --tb=short

      - name: Run linter
        run: uv run ruff check src/

  web:
    # The export and replay tests create an offscreen device for the app's
    # startup. lavapipe (mesa-vulkan-drivers) gives the runner a software
    # adapter, so they run here instead of skipping; any skip fails the job.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install a software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --extra offline --extra viz --extra svg --dev

      - name: Run the web tests with no skips
        # tests/web/browser needs Chromium; the browser job runs it.
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/web --ignore=tests/web/browser -v --tb=short -rs | tee web-tests.log
          if grep -q SKIPPED web-tests.log; then echo "web tests skipped on CI"; exit 1; fi

  browser:
    # The exported page in headless Chromium (Playwright): the web_walk replay against Python,
    # the page's own checks, and the visual parity with the desktop frame, which needs lavapipe
    # for Engine.render_frame. Any skip fails the job.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install a software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.13'

      - name: Install dependencies and Chromium
        run: |
          uv sync --extra offline --extra viz --dev --group browser
          uv run playwright install --with-deps chromium

      - name: Run the browser tests with no skips
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/web/browser -v --tb=short -rs | tee browser-tests.log
          if grep -q SKIPPED browser-tests.log; then echo "browser tests skipped on CI"; exit 1; fi
          # run --web drives the real CLI, the manifoldx script beside sys.executable.
          if ! grep -q "test_run_web.py::.* PASSED" browser-tests.log; then echo "test_run_web.py did not run"; exit 1; fi
