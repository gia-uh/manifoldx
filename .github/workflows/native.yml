# The rust-core branch carries the Rust migration, and its PRs run focused
# checks instead of the whole suite: the phase-0 native gates. These are
# blocking — the installed-wheel smoke and the missing-extension negative
# control fail the PR when they fail. The full suite (test.yml) still runs
# on main and release branches; main-parity for rust-core stays a
# coordinator decision until the phase-0 policy adds it.
name: Native

on:
  pull_request:
    branches: [rust-core]

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with rustfmt and clippy
        uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.14t'

      - name: Install dependencies
        run: uv sync --locked --group native --group dev

      - name: Check the workspace crates
        run: make native-check

      - name: Build the wheel for the free-threaded interpreter
        run: make native-build NATIVE_PYTHON=python3.14t

      - name: Verify the installed wheel (smoke and negative control)
        run: bash scripts/gates/native-verify.sh python3.14t dist

      - name: Packaging and startup contracts with CPU Engine callers
        # Root conftest probes a GPU during configuration; these checks need none.
        run: >-
          uv run --no-sync pytest -o addopts= --confcutdir=tests/core tests/core
          tests/test_engine.py::test_engine_stores_title_width_height_fullscreen
          tests/test_engine.py::test_engine_creation
          tests/test_engine.py::test_engine_startup_decorator
          tests/test_engine.py::test_engine_shutdown_decorator
          tests/test_engine.py::test_engine_quit
          tests/test_engine.py::test_engine_registers_frame_handlers
          tests/test_render_mvp.py::test_engine_has_camera
          tests/test_render_mvp.py::test_camera_has_position_and_target
          tests/test_ibl.py::test_engine_set_environment_preset
          tests/test_ibl.py::test_engine_set_environment_object
          tests/test_ibl.py::test_engine_set_environment_none
          tests/test_ibl.py::test_engine_environment_intensity
          tests/test_ibl_loading.py::test_set_environment_alone_starts_no_work
          tests/test_web_engine_apis.py -q

      - name: Rift coverage
        run: uvx --from git+https://github.com/apiad/rift@v0.9.0 rift check .
