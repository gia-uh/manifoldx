name: Docs gate

# The guide renders with every block executed (on lavapipe, a software Vulkan
# driver), docs/examples/ matches the chapters and each example runs. The test
# workflow calls it on every PR; the release workflow calls it before publishing.
on:
  workflow_call:
    inputs:
      target:
        description: "make target: docs-test, or docs-check to add the rift coverage rule"
        type: string
        default: docs-check
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install a software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --locked --extra offline --extra viz --extra svg --group docs

      - name: Docs gate
        run: make ${{ inputs.target || 'docs-check' }}
